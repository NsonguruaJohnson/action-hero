name: Hello world workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Print Hello World
        run: echo "Hello, World!"
        shell: bash
  
  goodbye_world_job:
    runs-on: ubuntu-latest
    steps:
      - name: Print Goodbye World
        run: echo "Goodbye, World!"
        shell: bash